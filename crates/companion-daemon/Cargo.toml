[package]
name = "companion-daemon"
description = "The companion daemon: one per machine, serving shells and docking orchestrators over a user-only Unix socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "companion-daemon"
path = "src/main.rs"

# The hook Claude Code calls. Its own binary so a hook invocation starts a few kilobytes of
# work instead of the whole daemon.
[[bin]]
name = "companion-hook"
path = "src/hook.rs"

[dependencies]
companion-adapter-claude.workspace = true
companion-adapter-workbench.workspace = true
companion-brain.workspace = true
companion-core.workspace = true
companion-protocol.workspace = true
companion-voice.workspace = true

async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "signal",
    "time",
    "io-std",
] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
