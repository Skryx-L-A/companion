[package]
name = "companion-core"
description = "Session adapters, event bus, register, settings and the role model of the companion daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
companion-protocol.workspace = true

async-trait.workspace = true
# The register groups its rows by calendar day, and a calendar day is a local-time notion
# `std::time` does not have at all.
chrono.workspace = true
rcgen.workspace = true
# The pattern set behind `redact`: the alternation of fixed key/token shapes is not
# something a handful of `str::find` calls can carry correctly, and the crate itself has no
# unsafe code, so it fits the workspace's `unsafe_code = "forbid"` lint without a carve-out.
regex.workspace = true
rustls-pemfile.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
companion-macos-ffi.workspace = true
