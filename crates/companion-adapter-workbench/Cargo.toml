[package]
name = "companion-adapter-workbench"
description = "Session adapter for the Claude Code Workbench: reads its state files, wb-state and tmux metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
companion-core.workspace = true
companion-protocol.workspace = true

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "process", "io-util", "net"] }
tracing.workspace = true

# Reading who is at the other end of a unix socket, and asking whether a pid is alive.
# Both through safe wrappers: this workspace forbids `unsafe`, so the raw `getsockopt` the
# workbench's own tool uses is not an option here.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "socket"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
