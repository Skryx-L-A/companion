[package]
name = "companion-adapter-hermes"
description = "Session adapter for the Hermes Agent of Nous Research: ACP over stdio against `hermes acp`, with the configuration under HERMES_HOME."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
companion-core.workspace = true
companion-protocol.workspace = true

async-trait.workspace = true
# The session store is SQLite. Read-only, and only because ACP hands out no transcript.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "process", "io-util", "macros"] }
tracing.workspace = true

# SIGTERM before SIGKILL when the agent process is ended: Hermes keeps its sessions in a
# SQLite file, and going straight to SIGKILL denies it the chance to close it. Same
# dependency and same two-step as the PTY adapter.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal"] }

[dev-dependencies]
companion-core.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
