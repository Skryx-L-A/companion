#
# The source of `companion-ios.xcodeproj`. The project itself is generated from this file with
# `xcodegen generate` and is NOT in the repository: `.gitignore` excludes `*.xcodeproj/`, and a
# generated file in a repository runs away from its source. Run `xcodegen generate` before
# building, and again after every change here; files under `Sources/` are picked up on their
# own. The same thing is written in README.md, at more length and with the reasons.
name: companion-ios
options:
  bundleIdPrefix: de.skryx.companion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

packages:
  companion-mac:
    path: ..

targets:
  companion-ios:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: companion-mac
        product: CompanionProtocol
      - package: companion-mac
        product: CompanionMobile
      - package: companion-mac
        product: CompanionFigure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.skryx.companion.ios
        PRODUCT_NAME: companion
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        # No Apple developer account yet (DESIGN.md, section Mobil, Push und Store), so no
        # team is set and a device build will ask for one. The simulator signs ad hoc, and
        # that is not optional: an unsigned app has no entitlements, and without them the
        # keychain refuses every write with errSecMissingEntitlement — which is where this
        # app keeps the device token.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  # Tippt den Weg durch, den kein Paket-Test erreicht: von der Kopplung in die App.
  companion-iosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: companion-ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.skryx.companion.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: companion-ios

schemes:
  companion-ios:
    build:
      targets:
        companion-ios: all
        companion-iosUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - companion-iosUITests
