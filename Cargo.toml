[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Skryx-L-A/companion"

[workspace.dependencies]
companion-protocol = { path = "crates/companion-protocol" }
companion-core = { path = "crates/companion-core" }
companion-adapter-workbench = { path = "crates/companion-adapter-workbench" }
companion-adapter-claude = { path = "crates/companion-adapter-claude" }
companion-adapter-codex = { path = "crates/companion-adapter-codex" }
companion-adapter-pty = { path = "crates/companion-adapter-pty" }
companion-voice = { path = "crates/companion-voice" }
companion-brain = { path = "crates/companion-brain" }

async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
# preserve_order everywhere, not only where a JSON file of a person is edited: with the
# feature on in one crate only, the generated protocol schemas came out in a different key
# order depending on which crates a build happened to include.
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
